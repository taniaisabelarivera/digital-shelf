<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Digital Shelf</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <div class="signup-box">
    <h1>Sign Up</h1>

    <form id="signup-form">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" minlength="3" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" minlength="8" required>

      <button type="submit">Create Account</button>
      <p id="signup-error" role="alert" style="color:#c0392b;margin-top:12px;text-align:center"></p>
    </form>

    <p class="loginpage-link">
      Already have an account? <a href="/login.html">Log in</a>
    </p>
  </div>

  <script type="module" src="signup.js"></script>
</body>
</html>
