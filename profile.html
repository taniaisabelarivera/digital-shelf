<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Profile | Digital Shelf</title>
  <link rel="stylesheet" href="./profile_style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
  <main>
    <div class="site-header">
      <div class="user-info">
        <a href="/profile.html" class="avatar" aria-label="Go to your profile"></a>
        <a class="site-name" href="/index.html">Digital Shelf</a>
      </div>
      <nav class="auth-buttons">
        <a href="/login.html" class="btn btn-login">Log In</a>
        <a href="/signup.html" class="btn btn-signup">Sign Up</a>
      </nav>
    </div>

    <div class="profile-card">
      <div class="profile-top">
        <div id="avatar"></div>
        <div class="profile-info">
          <h1 id="profile-name">Hello, Guest</h1>
          <p id="profile-email">Log in to see your profile</p>
          <p id="profile-bio"></p>
          <p id="profile-dob">DOB:</p>
          <p id="profile-since">Active Since:</p>
          <button type="button" id="edit-profile" class="btn btn-login" hidden>Edit Profile</button>
        </div>
      </div>
      <div class="profile-stats">
        <div class="stat"><span class="stat-number" id="stat-completed">0</span><span class="stat-label">Movies Completed</span></div>
        <div class="stat"><span class="stat-number" id="stat-friends">0</span><span class="stat-label">Friends Made</span></div>
        <div class="stat"><span class="stat-number" id="stat-dropped">0</span><span class="stat-label">Movies Dropped</span></div>
      </div>
    </div>

    <div id="matches" hidden>
      <h3>People Like You</h3>
      <ul id="matches-list"></ul>
    </div>

    <div id="my-stuff">
      <h3>My Stuff</h3>
      <select name="sort" id="sort">
        <option value="">Sort By</option>
        <option value="release_date.asc">Release Date (Asc)</option>
        <option value="release_date.desc">Release Date (Desc)</option>
        <option value="title.asc">Title (A-Z)</option>
        <option value="title.desc">Title (Z-A)</option>
      </select>
    </div>
    <div id="content"></div>
    <footer>
      <nav aria-label="Page nav">
        <ul class="pagination">
          <li><a href="#" id="prevButton">Previous</a></li>
          <li><span id="pageNumbers">Page 1 of 1</span></li>
          <li><a href="#" id="nextButton">Next</a></li>
        </ul>
      </nav>
    </footer>
  </main>

  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <form id="edit-form">
      <h2 id="edit-title">Edit Profile</h2>

      <div class="edit-avatar-row">
        <div id="edit-avatar-preview" role="img" aria-label="Profile photo preview"></div>
        <div class="edit-avatar-buttons">
          <button type="button" id="avatar-choose" class="btn btn-login">Choose photo</button>
          <button type="button" id="avatar-remove" class="btn btn-secondary">Remove photo</button>
          <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp" hidden>
        </div>
      </div>

      <label for="edit-username">Username</label>
      <input type="text" id="edit-username" minlength="3" maxlength="30" pattern="[\w.\-]{3,30}"
             title="3-30 letters, numbers, . _ or -" autocomplete="username" required>

      <label for="edit-dob">Date of birth</label>
      <input type="date" id="edit-dob" min="1900-01-01">

      <label for="edit-bio">Bio <span id="bio-count">0/300</span></label>
      <textarea id="edit-bio" maxlength="300" placeholder="Tell people what you like to watch..."></textarea>

      <p id="edit-error" role="alert"></p>

      <div class="edit-actions">
        <button type="button" id="edit-cancel" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="edit-save" class="btn btn-login">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="auth.js"></script>
  <script type="module" src="profile.js"></script>
  <script type="module" src="profile_edit.js"></script>
</body>
</html>
